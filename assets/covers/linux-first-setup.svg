<text x="84" y="170" fill="#47765f" font-family="monospace" font-size="19" font-weight="700" letter-spacing="4">KANIZ FATIHA · LINUX NOTES</text><text x="84" y="271" fill="#17231f" font-family="Georgia,serif" font-size="61" font-weight="700">Your first Linux</text><text x="84" y="346" fill="#17231f" font-family="Georgia,serif" font-size="61" font-weight="700">setup, calmly.</text><text x="87" y="403" fill="#53645a" font-family="sans-serif" font-size="23">A practical checklist before you begin.</text><rect x="86" y="455" width="112" height="7" rx="4" fill="#4f8266"/>
