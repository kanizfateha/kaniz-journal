<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">A calm checklist for setting up Linux</title><desc id="desc">A laptop and checklist illustrating safe preparation before trying Linux.</desc>
