<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Two ways a Steam game can run on Linux</title><desc id="desc">Diagram showing that games with Linux builds use their native version, while Windows games can run through Proton.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f3f6ef"/><stop offset="1" stop-color="#e6eee4"/></linearGradient><linearGradient id="box" x2="1" y2="1"><stop stop-color="#20372a"/><stop offset="1" stop-color="#314e3b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f9271"/></marker></defs>
<rect width="1000" height="480" rx="25" fill="url(#bg)"/><text x="54" y="63" fill="#355c43" font-family="monospace" font-size="15" letter-spacing="2">A SIMPLE MENTAL MODEL</text><text x="54" y="111" fill="#17231f" font-family="Georgia,serif" font-size="33">Two routes from Steam to play</text>
<rect x="55" y="175" width="225" height="170" rx="15" fill="url(#box)"/><text x="167" y="230" text-anchor="middle" fill="#b8ed8d" font-family="monospace" font-size="15">START HERE</text><text x="167" y="274" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="700" font-size="21">Steam library</text><text x="167" y="308" text-anchor="middle" fill="#cbdbcb" font-family="system-ui,sans-serif" font-size="14">Choose a game</text>
<path d="M280 254h120v-30h85m-85 30v90h85" fill="none" stroke="#6f9271" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="505" y="165" width="420" height="128" rx="14" fill="#fff" stroke="#ccd9ca" stroke-width="2"/><circle cx="551" cy="211" r="19" fill="#e7f1df"/><path d="m542 211 7 7 13-15" fill="none" stroke="#457253" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="591" y="207" fill="#315b44" font-family="monospace" font-size="14">ROUTE A</text><text x="591" y="242" fill="#17231f" font-family="system-ui,sans-serif" font-weight="700" font-size="20">Native Linux build</text><text x="591" y="269" fill="#627068" font-family="system-ui,sans-serif" font-size="14">Runs as a Linux game</text>
<rect x="505" y="313" width="420" height="128" rx="14" fill="#fff" stroke="#ccd9ca" stroke-width="2"/><circle cx="551" cy="359" r="19" fill="#e7f1df"/><path d="m542 359 7 7 13-15" fill="none" stroke="#457253" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="591" y="355" fill="#315b44" font-family="monospace" font-size="14">ROUTE B</text><text x="591" y="390" fill="#17231f" font-family="system-ui,sans-serif" font-weight="700" font-size="20">Windows build + Proton</text><text x="591" y="417" fill="#627068" font-family="system-ui,sans-serif" font-size="14">Compatibility layer; check each title</text>
<text x="55" y="454" fill="#647269" font-family="system-ui,sans-serif" font-size="13">Proton expands options, but compatibility and performance vary by game and hardware.</text>
</svg>
