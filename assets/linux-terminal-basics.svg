<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><title>A gentle introduction to the Linux terminal</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b18"/><stop offset="1" stop-color="#2a4132"/></linearGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#26392e"/><stop offset="1" stop-color="#17231d"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><g fill="none" stroke="#b8ed8d" stroke-opacity=".12"><circle cx="900" cy="332" r="256"/><circle cx="900" cy="332" r="192"/><circle cx="900" cy="332" r="310"/></g><text x="95" y="178" fill="#b8ed8d" font-family="monospace" font-size="15" letter-spacing="3">KANIZFATIHA.SH / LINUX BASICS</text><text x="91" y="272" fill="#f5f5ef" font-family="Georgia,serif" font-size="69">Meet the</text><text x="91" y="349" fill="#b8ed8d" font-family="Georgia,serif" font-size="69">terminal.</text><text x="96" y="404" fill="#c2cec2" font-family="system-ui,sans-serif" font-size="19">Four safe commands to find your way around</text><path d="M97 464h110" stroke="#89ba84" stroke-width="2"/><text x="97" y="505" fill="#adc0af" font-family="monospace" font-size="15" letter-spacing="2">pwd  ·  ls  ·  cd  ·  man</text><g transform="translate(640 152)"><rect width="452" height="352" rx="18" fill="url(#panel)" stroke="#68816b" stroke-width="2"/><path d="M18 0h416a18 18 0 0 1 18 18v41H0V18A18 18 0 0 1 18 0" fill="#35483a"/><circle cx="25" cy="29" r="6" fill="#ef8973"/><circle cx="46" cy="29" r="6" fill="#eac36e"/><circle cx="67" cy="29" r="6" fill="#a4d489"/><text x="101" y="34" fill="#dbe7d9" font-family="monospace" font-size="14">user@linux: ~</text><text x="36" y="112" fill="#b8ed8d" font-family="monospace" font-size="19">$ pwd</text><text x="36" y="146" fill="#e4eae1" font-family="monospace" font-size="17">/home/kaniz</text><text x="36" y="197" fill="#b8ed8d" font-family="monospace" font-size="19">$ ls</text><text x="36" y="231" fill="#e4eae1" font-family="monospace" font-size="16">Desktop  Documents  Downloads</text><text x="36" y="282" fill="#b8ed8d" font-family="monospace" font-size="19">$ cd Documents</text><text x="36" y="319" fill="#b8ed8d" font-family="monospace" font-size="16">✓ Just looking around.</text></g><rect x="1" y="1" width="1198" height="673" rx="24" fill="none" stroke="#b4d1ad" stroke-opacity=".17" stroke-width="2"/></svg>
